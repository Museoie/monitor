<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0 auto; max-width: 960px; padding: 1rem; background: #111; color: #eee; }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.4rem; margin: 0.5rem 0; }
  h2 { font-size: 1.1rem; margin: 1.2rem 0 0.4rem; }
  button, select, input { font: inherit; background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 0.4rem 0.7rem; }
  button { cursor: pointer; }
  button:hover { background: #333; }
  input[type="password"], input[type="text"] { width: 100%; box-sizing: border-box; }
  form { max-width: 420px; display: grid; gap: 0.6rem; }
  .error { color: #ff8080; min-height: 1.2em; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.7rem; }
  .card { background: #1c1c1c; border: 1px solid #333; border-radius: 8px; padding: 0.7rem; cursor: pointer; }
  .card.selected { border-color: #6aa9ff; }
  .card .name { font-weight: 600; word-break: break-all; }
  .card .meta { color: #bbb; font-size: 0.85rem; word-break: break-all; }
  .ok { color: #7ddc7d; }
  .bad { color: #ff8080; }
  .row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin: 0.5rem 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 1rem; margin: 0.5rem 0; }
  dt { color: #bbb; }
  dd { margin: 0; word-break: break-all; }
  pre { background: #000; border: 1px solid #333; border-radius: 8px; padding: 0.7rem; overflow: auto; max-height: 60vh; white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; }
  .muted { color: #999; font-size: 0.85rem; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin: 0.5rem 0; }
  .chart { background: #1c1c1c; border: 1px solid #333; border-radius: 8px; padding: 0.7rem; }
  .chart h4 { margin: 0 0 0.4rem; font-size: 0.95rem; }
  .chart canvas { width: 100%; height: 140px; display: block; }
  .chart .legend { color: #bbb; font-size: 0.8rem; margin-top: 0.3rem; }
  @media (max-width: 640px) {
    .charts { grid-template-columns: 1fr; }
    .cards { display: flex; flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 0.4rem; -webkit-overflow-scrolling: touch; }
    .cards .card { flex: 0 0 76%; scroll-snap-align: start; }
  }
</style>
</head>
<body>
<header>
  <h1>Monitor</h1>
  <button id="logoutBtn" hidden>Log out</button>
</header>

<section id="loginView">
  <h2>Log in</h2>
  <p class="muted">Enter the monitor token (the same token the API accepts as a Bearer token). A successful login sets a cookie valid for 1 day, refreshed on every request.</p>
  <form id="loginForm">
    <label for="tokenInput">Token</label>
    <input id="tokenInput" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <p id="loginError" class="error"></p>
  </form>
</section>

<section id="appView" hidden>
  <h2>Containers</h2>
  <div class="row">
    <button id="refreshBtn">Refresh</button>
    <span id="containersStatus" class="muted"></span>
  </div>
  <div id="containers" class="cards"></div>

  <section id="detailView" hidden>
    <h2 id="detailTitle"></h2>
    <h3>Stats</h3>
    <dl id="stats"></dl>
    <p id="statsStatus" class="muted"></p>
    <div class="charts">
      <div class="chart">
        <h4>CPU %</h4>
        <canvas id="cpuChart" height="140"></canvas>
        <div id="cpuLegend" class="legend"></div>
      </div>
      <div class="chart">
        <h4>Memory (working set)</h4>
        <canvas id="memChart" height="140"></canvas>
        <div id="memLegend" class="legend"></div>
      </div>
    </div>
    <h3>Logs</h3>
    <div class="row">
      <label>Tail
        <select id="tailSelect">
          <option value="100" selected>100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
          <option value="5000">5000</option>
        </select>
      </label>
      <label>Since <input id="sinceInput" type="text" placeholder="e.g. 30m ago (optional)"></label>
      <button id="logsBtn">Load logs</button>
      <label><input id="autoRefreshCheck" type="checkbox" checked> Auto-refresh (30s)</label>
    </div>
    <pre id="logs"></pre>
    <p id="logsStatus" class="muted"></p>
  </section>
</section>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const loginView = $("loginView"), appView = $("appView"), logoutBtn = $("logoutBtn");
const loginForm = $("loginForm"), tokenInput = $("tokenInput"), loginError = $("loginError");
const containersEl = $("containers"), containersStatus = $("containersStatus");
const detailView = $("detailView"), detailTitle = $("detailTitle");
const statsEl = $("stats"), statsStatus = $("statsStatus");
const logsEl = $("logs"), logsStatus = $("logsStatus");
const tailSelect = $("tailSelect"), sinceInput = $("sinceInput");
const cpuChart = $("cpuChart"), memChart = $("memChart");
const cpuLegend = $("cpuLegend"), memLegend = $("memLegend");

let selected = null;
let autoTimer = null;
let lastStats = null;

function showLogin() {
  loginView.hidden = false;
  appView.hidden = true;
  logoutBtn.hidden = true;
  detailView.hidden = true;
  selected = null;
  stopAuto();
}

function showApp() {
  loginView.hidden = true;
  appView.hidden = false;
  logoutBtn.hidden = false;
}

function text(tag, value) {
  const el = document.createElement(tag);
  el.textContent = value;
  return el;
}

// Every API call goes through here: same-origin cookies are sent
// automatically, and a 401 (expired/missing session) drops back to login.
async function api(path, options) {
  const res = await fetch(path, { credentials: "same-origin", ...(options || {}) });
  if (res.status === 401) {
    showLogin();
    throw new Error("Unauthorized");
  }
  if (!res.ok) throw new Error(`${path} -> ${res.status}`);
  return res;
}

function fmtBytes(n) {
  if (n === null || n === undefined) return "—";
  if (n >= 1 << 30) return (n / (1 << 30)).toFixed(2) + " GiB";
  if (n >= 1 << 20) return (n / (1 << 20)).toFixed(1) + " MiB";
  if (n >= 1 << 10) return (n / (1 << 10)).toFixed(1) + " KiB";
  return n + " B";
}

function fmtPct(ratio) {
  return ratio === null || ratio === undefined ? "—" : (ratio * 100).toFixed(1) + "%";
}

function fmtTs(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return isNaN(d) ? ts : d.toLocaleString();
}

async function loadContainers() {
  containersStatus.textContent = "Loading…";
  try {
    const [containers, health] = await Promise.all([
      api("/containers").then((r) => r.json()),
      api("/health").then((r) => r.json()).catch(() => null),
    ]);
    const healthMap = (health && health.health) || {};
    containersEl.replaceChildren();
    if (!containers.length) {
      containersStatus.textContent = "No containers running.";
      return;
    }
    containersStatus.textContent = `${containers.length} container(s) · updated ${new Date().toLocaleTimeString()}`;
    for (const c of containers) {
      const card = document.createElement("div");
      card.className = "card" + (selected === c.name ? " selected" : "");
      card.appendChild(Object.assign(text("div", c.name), { className: "name" }));
      const state = text("div", `${c.state || "?"} · ${c.status || ""}`);
      state.className = "meta";
      card.appendChild(state);
      card.appendChild(Object.assign(text("div", c.image || ""), { className: "meta" }));
      const h = healthMap[c.name];
      if (h !== undefined) {
        const hEl = text("div", `health: ${h}`);
        hEl.className = "meta " + (h === "healthy" || h === "none" ? "ok" : "bad");
        card.appendChild(hEl);
      }
      card.addEventListener("click", () => selectContainer(c.name));
      containersEl.appendChild(card);
    }
  } catch (e) {
    if (e.message !== "Unauthorized") containersStatus.textContent = `Failed to load containers: ${e.message}`;
  }
}

// History charts: plain canvas, no dependencies. Samples arrive evenly
// spaced (one per poll), so x is the sample index and nulls leave gaps.
function drawChart(canvas, values, opts) {
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight || 140;
  if (w <= 0) return;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const padL = 46, padR = 8, padT = 8, padB = 18;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const nums = values.filter((v) => v !== null && v !== undefined);
  if (nums.length < 2) return;
  let ymax = Math.max(...nums, opts.limit || 0);
  if (ymax <= 0) ymax = 1;
  ymax *= 1.1;
  const x = (i) => padL + (i / (values.length - 1)) * plotW;
  const y = (v) => padT + plotH - (v / ymax) * plotH;
  ctx.strokeStyle = "#333";
  ctx.fillStyle = "#999";
  ctx.font = "10px system-ui, sans-serif";
  ctx.lineWidth = 1;
  for (const frac of [0, 0.5, 1]) {
    const gy = padT + plotH - frac * plotH;
    ctx.beginPath();
    ctx.moveTo(padL, gy);
    ctx.lineTo(w - padR, gy);
    ctx.stroke();
    ctx.fillText(opts.format(ymax * frac), 2, gy + 3);
  }
  if (opts.t0) ctx.fillText(opts.t0, padL, h - 5);
  if (opts.t1) {
    const tw = ctx.measureText(opts.t1).width;
    ctx.fillText(opts.t1, w - padR - tw, h - 5);
  }
  if (opts.limit) {
    ctx.strokeStyle = "#ff8080";
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(padL, y(opts.limit));
    ctx.lineTo(w - padR, y(opts.limit));
    ctx.stroke();
    ctx.setLineDash([]);
  }
  const runs = [];
  let run = [];
  for (let i = 0; i < values.length; i++) {
    const v = values[i];
    if (v === null || v === undefined) {
      if (run.length) runs.push(run);
      run = [];
    } else {
      run.push([x(i), y(v)]);
    }
  }
  if (run.length) runs.push(run);
  ctx.strokeStyle = opts.color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (const r of runs) {
    ctx.moveTo(r[0][0], r[0][1]);
    for (let j = 1; j < r.length; j++) ctx.lineTo(r[j][0], r[j][1]);
  }
  ctx.stroke();
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = opts.color;
  for (const r of runs) {
    ctx.beginPath();
    ctx.moveTo(r[0][0], padT + plotH);
    for (const [px, py] of r) ctx.lineTo(px, py);
    ctx.lineTo(r[r.length - 1][0], padT + plotH);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function clearCharts() {
  for (const [canvas, legend] of [[cpuChart, cpuLegend], [memChart, memLegend]]) {
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    legend.textContent = "";
  }
}

function drawCharts() {
  if (!lastStats || !selected || detailView.hidden) return;
  const history = lastStats.history || [];
  const spanMs = history.length > 1 ? (history.length - 1) * (lastStats.poll_interval_ms || 60000) : 0;
  const span = spanMs ? ` · last ~${Math.max(1, Math.round(spanMs / 60000))} min` : "";
  const fmtTime = (ts) => {
    const d = new Date(ts);
    return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  };
  const t0 = history.length ? fmtTime(history[0].ts) : "";
  const t1 = history.length ? fmtTime(history[history.length - 1].ts) : "";
  const cpuVals = history.map((s) => s.cpu_percent);
  const cpuNums = cpuVals.filter((v) => v !== null && v !== undefined);
  if (cpuNums.length < 2) {
    cpuLegend.textContent = "Not enough samples yet.";
    cpuChart.getContext("2d").clearRect(0, 0, cpuChart.width, cpuChart.height);
  } else {
    cpuLegend.textContent = `last ${cpuNums[cpuNums.length - 1].toFixed(1)}% · max ${Math.max(...cpuNums).toFixed(1)}% · ${history.length} samples${span}`;
    drawChart(cpuChart, cpuVals, { color: "#6aa9ff", format: (v) => v.toFixed(0) + "%", t0, t1 });
  }
  const memVals = history.map((s) => s.working_set_bytes);
  const latest = lastStats.latest;
  const capped = latest && latest.usage_ratio !== null && latest.limit_bytes ? latest.limit_bytes : null;
  if (memVals.length < 2) {
    memLegend.textContent = "Not enough samples yet.";
    memChart.getContext("2d").clearRect(0, 0, memChart.width, memChart.height);
  } else {
    memLegend.textContent = `last ${fmtBytes(memVals[memVals.length - 1])} · max ${fmtBytes(Math.max(...memVals))}${capped ? ` · limit ${fmtBytes(capped)}` : ""} · ${history.length} samples${span}`;
    drawChart(memChart, memVals, { color: "#7ddc7d", format: fmtBytes, limit: capped, t0, t1 });
  }
}

let resizeTimer = null;
window.addEventListener("resize", () => {
  if (resizeTimer !== null) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawCharts, 150);
});

async function loadStats() {
  if (!selected) return;
  statsStatus.textContent = "Loading…";
  try {
    const data = await api(`/stats/${encodeURIComponent(selected)}`).then((r) => r.json());
    const latest = data.latest;
    statsEl.replaceChildren();
    const rows = [
      ["Latest sample", latest ? fmtTs(latest.ts) : "no samples yet"],
      ["Memory (working set)", latest ? fmtBytes(latest.working_set_bytes) : "—"],
      ["Memory (with page cache)", latest ? fmtBytes(latest.usage_bytes) : "—"],
      ["Memory limit", latest ? fmtBytes(latest.limit_bytes) : "— (no cap)"],
      ["Memory ratio", latest ? fmtPct(latest.usage_ratio) : "—"],
      ["CPU", latest && latest.cpu_percent !== null ? latest.cpu_percent.toFixed(1) + "%" : "—"],
      ["Samples kept", String((data.history || []).length)],
    ];
    for (const [k, v] of rows) {
      statsEl.appendChild(text("dt", k));
      statsEl.appendChild(text("dd", v));
    }
    statsStatus.textContent = `Poll interval ${data.poll_interval_ms}ms · pressure threshold ${Math.round((data.pressure_threshold_ratio || 0) * 100)}%`;
    lastStats = data;
    drawCharts();
  } catch (e) {
    if (e.message !== "Unauthorized") statsStatus.textContent = `Failed to load stats: ${e.message}`;
  }
}

async function loadLogs() {
  if (!selected) return;
  logsStatus.textContent = "Loading…";
  try {
    const params = new URLSearchParams({ tail: tailSelect.value });
    const since = sinceInput.value.trim();
    if (since) params.set("since", since);
    const res = await api(`/logs/${encodeURIComponent(selected)}?${params}`);
    logsEl.textContent = await res.text();
    logsStatus.textContent = `Showing up to ${tailSelect.value} lines${since ? ` since ${since}` : ""} · updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    if (e.message !== "Unauthorized") logsStatus.textContent = `Failed to load logs: ${e.message}`;
  }
}

function selectContainer(name) {
  selected = name;
  detailTitle.textContent = name;
  detailView.hidden = false;
  lastStats = null;
  clearCharts();
  document.querySelectorAll(".card").forEach((card) => {
    card.classList.toggle("selected", card.querySelector(".name").textContent === name);
  });
  void loadStats();
  void loadLogs();
}

function startAuto() {
  stopAuto();
  autoTimer = setInterval(() => {
    void loadContainers();
    if (selected) {
      void loadStats();
      if ($("autoRefreshCheck").checked) void loadLogs();
    }
  }, 30_000);
}

function stopAuto() {
  if (autoTimer !== null) {
    clearInterval(autoTimer);
    autoTimer = null;
  }
}

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginError.textContent = "";
  try {
    const res = await fetch("/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: tokenInput.value }),
    });
    if (!res.ok) {
      loginError.textContent = res.status === 401 ? "Invalid token." : `Login failed (${res.status}).`;
      return;
    }
    tokenInput.value = "";
    showApp();
    await loadContainers();
    startAuto();
  } catch (err) {
    loginError.textContent = `Login failed: ${err.message}`;
  }
});

logoutBtn.addEventListener("click", async () => {
  try {
    await fetch("/logout", { method: "POST", credentials: "same-origin" });
  } catch { /* clearing local state is enough */ }
  showLogin();
});

$("refreshBtn").addEventListener("click", () => {
  void loadContainers();
  if (selected) {
    void loadStats();
    void loadLogs();
  }
});
$("logsBtn").addEventListener("click", () => void loadLogs());

// On load: a valid session cookie takes us straight to the dashboard,
// otherwise the API 401s and we land on the login form.
api("/containers")
  .then(() => {
    showApp();
    return loadContainers();
  })
  .then(startAuto)
  .catch(() => { /* showLogin already ran on 401; other errors surface on retry */ });
</script>
</body>
</html>
